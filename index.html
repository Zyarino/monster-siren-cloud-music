<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' ms-cover: https: http://127.0.0.1:*; media-src 'self' ms-audio:; connect-src 'self' http://127.0.0.1:*; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Monster Siren Cloud Music</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <!-- ============ Sidebar ============ -->
    <aside id="sidebar">
      <div class="brand">
        <img class="brand-logo" src="msr.svg" alt="Monster Siren Cloud Music" />
      </div>

      <nav class="nav">
        <button class="nav-item active" id="nav-home">
          <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M4 10.8 12 4l8 6.8V20h-5.5v-5.5h-5V20H4z"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-item" id="nav-search">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.2-4.2" stroke-linecap="round"/></svg>
          <span>Search</span>
        </button>
      </nav>

      <div class="lib-head">
        <span>Your Music</span>
        <button class="mini-btn" id="lib-refresh" title="Reload albums">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v6h6M20 20v-6h-6"/><path d="M20 9a8 8 0 0 0-14.2-3.2L4 10M4 15a8 8 0 0 0 14.2 3.2L20 14"/></svg>
        </button>
      </div>
      <div class="lib-list" id="lib-list">
        <div class="lib-empty">Albums you download appear here.</div>
      </div>

      <div class="side-bottom">
        <button class="dir-chip" id="dir-btn" title="Change download folder"></button>
        <button class="mini-btn" id="open-dir-btn" title="Open download folder">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3.5 6.5A1.5 1.5 0 0 1 5 5h4l2 2.5h8A1.5 1.5 0 0 1 20.5 9v8.5A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg>
        </button>
      </div>
    </aside>

    <!-- ============ Main ============ -->
    <main id="main">
      <div id="topbar">
        <div class="nav-arrows">
          <button class="round-btn" id="back-btn" title="Go back">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 6-6 6 6 6"/></svg>
          </button>
          <button class="round-btn" id="fwd-btn" title="Go forward" disabled>
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9.5 6 6 6-6 6"/></svg>
          </button>
        </div>

        <div class="search-box" id="search-box">
          <span class="search-icon">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4.2-4.2" stroke-linecap="round"/></svg>
          </span>
          <input id="search" type="text" placeholder="Search" autocomplete="off" spellcheck="false" />
          <button class="search-clear" id="search-clear" title="Clear" hidden>
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>

        <div class="topbar-right">
          <button class="pill-btn" id="top-open-dir-btn" title="Open download folder">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3.5 6.5A1.5 1.5 0 0 1 5 5h4l2 2.5h8A1.5 1.5 0 0 1 20.5 9v8.5A1.5 1.5 0 0 1 19 19H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg>
            <span id="top-dir-label"></span>
          </button>
        </div>
      </div>

      <div id="content"></div>
    </main>
  </div>

  <!-- ============ Download queue panel ============ -->
  <aside id="dl-panel" class="hidden">
    <div class="dl-panel-head">
      <span>Downloads</span>
      <div class="dl-panel-actions">
        <button class="text-btn" id="pause-queue-btn" title="Pause download queue">Pause</button>
        <button class="text-btn" id="dl-close-btn">Close</button>
      </div>
    </div>
    <div id="dl-list" class="dl-list"></div>
  </aside>

  <!-- ============ Lyrics panel ============ -->
  <aside id="lyrics-panel" class="hidden">
    <div class="lyrics-head">
      <img id="lyr-cover" class="lyr-cover empty" alt="" />
      <div class="lyr-info">
        <div class="lyr-name" id="lyr-name">Title</div>
        <div class="lyr-sub" id="lyr-sub">Artist · Album</div>
      </div>
      <button class="round-btn" id="lyr-close" title="Close lyrics">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="lyrics" id="lyrics"></div>
  </aside>

  <!-- ============ Player bar ============ -->
  <footer id="player-bar">
    <div class="np-left">
      <img id="np-cover" class="np-cover empty" alt="" />
      <div class="np-info">
        <div class="np-name" id="np-name">Not playing</div>
        <div class="np-sub" id="np-sub">Ready</div>
      </div>
    </div>

    <div class="np-center">
      <div class="np-controls">
        <button class="ctl small" id="shuffle-btn" title="Shuffle">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h4v4M20 4 8 16M8 8H4v4M20 20l-5-5M4 8h4v4"/></svg>
        </button>
        <button class="ctl small" id="prev-btn" title="Previous">
          <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM19 5.5v13L9 12z"/></svg>
        </button>
        <button class="ctl-btn" id="play-pause-btn" title="Play">
          <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
        </button>
        <button class="ctl small" id="next-btn" title="Next">
          <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM5 5.5v13l10-6.5z"/></svg>
        </button>
        <button class="ctl small" id="repeat-btn" title="Repeat">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>
      <div class="np-progress">
        <span class="np-time" id="np-cur">0:00</span>
        <div class="np-progress-bar" id="np-bar"><div id="np-fill"></div></div>
        <span class="np-time" id="np-dur">0:00</span>
      </div>
    </div>

    <div class="np-right">
      <button class="round-btn" id="lyrics-btn" title="Show lyrics">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19V6l12-3v13"/><circle cx="4.5" cy="19" r="1.5" fill="currentColor" stroke="none"/><circle cx="16.5" cy="16" r="1.5" fill="currentColor" stroke="none"/></svg>
      </button>
      <div class="np-volume">
        <button class="ctl small" id="vol-btn" title="Mute">
          <svg class="ic" viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <input id="vol-slider" type="range" min="0" max="100" value="80" title="Volume" />
      </div>
      <button class="round-btn" id="queue-btn" title="Downloads">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h7"/></svg>
        <span class="badge" id="queue-count" hidden></span>
      </button>
      <button class="round-btn" id="clear-btn" title="Clear finished downloads">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div>
  </footer>

  <audio id="audio" preload="metadata"></audio>

  <div id="toasts"></div>

  <script src="renderer.js"></script>
</body>
</html>
